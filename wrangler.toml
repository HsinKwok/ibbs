# Cloudflare Workers 配置（占位模板，可安全提交）
# 资源 ID 已脱敏：请复制本文件为 wrangler.local.toml，填入你自己的资源 ID 后使用：
#   wrangler d1 create forum
#   wrangler d1 execute forum --local --file=./d1_schema.sql
#   wrangler dev -c wrangler.local.toml
#   wrangler deploy -c wrangler.local.toml
name = "forum"
main = "worker.js"
compatibility_date = "2024-11-01"

# 开启 Node.js 兼容（提供 global / process / Buffer 等）
compatibility_flags = ["nodejs_compat"]

# D1 数据库绑定（与 SqlFun.js 中 globalThis.DB 对应）
[[d1_databases]]
binding = "DB"
database_name = "forum"
database_id = "<YOUR_D1_DATABASE_ID>"

# R2 对象存储绑定（与 upload.js 中 global.R2 对应）
[[r2_buckets]]
binding = "R2"
bucket_name = "forum-uploads"

# KV 命名空间绑定（与 Redis.js 中 globalThis 的缓存对应）
[[kv_namespaces]]
binding = "KV"
id = "<YOUR_KV_NAMESPACE_ID>"

# Workers 原生限流（Rate Limiting binding）：计数在边缘节点侧完成，不消耗 KV 写额度。
# 注意：period 只能是 10 或 60 秒，且计数为单个边缘节点级别（非全局严格配额），属尽力而为。
# limit 为「60 秒内允许的请求数」，与 app/controller/user/threads.js 中的阈值保持一致。
[[ratelimits]]
name = "RATE_LIMITER_POST_USER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

# 新用户发帖（注册未满 24 小时或内容不足 5 条）
[[ratelimits]]
name = "RATE_LIMITER_POST_NEW"
namespace_id = "1002"
simple = { limit = 2, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER_POST_IP"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER_COMMENT_USER"
namespace_id = "1004"
simple = { limit = 10, period = 60 }

# 新用户评论
[[ratelimits]]
name = "RATE_LIMITER_COMMENT_NEW"
namespace_id = "1005"
simple = { limit = 3, period = 60 }

[[ratelimits]]
name = "RATE_LIMITER_COMMENT_IP"
namespace_id = "1006"
simple = { limit = 30, period = 60 }

# 智能放置：让 Worker 就近运行在 D1 等后端资源附近
[placement]
mode = "smart"

# 可观测性：开启日志与问题洞察
[observability]
enabled = true

[observability.issues]
enabled = true

# 自定义域名：后端 API 绑定到 api.ibbs.xyz（zone 需已接入本账号）
[[routes]]
pattern = "api.ibbs.xyz"
custom_domain = true

# 可选：R2 自定义公开域名（若为空则回退到 Worker 自身 origin 提供文件）
[vars]
R2_PUBLIC_URL = ""
# 允许携带凭证访问的跨域来源（逗号分隔）；含线上前端与本地开发地址
CORS_ORIGINS = "https://ibbs.xyz,https://www.ibbs.xyz,http://localhost:3000,http://127.0.0.1:3000"

# 邮件发送使用 SMTP（基于 cloudflare:sockets + @workermailer/smtp）。
# SMTP 配置在后台「邮件配置」页面维护（HOST/端口/加密模式/账号/密码/发件人），存于 n_configuration 表。
